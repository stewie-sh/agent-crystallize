name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Validate public crystal fixture
        run: node dist/index.js validate --files examples/sanitized-session-crystal.md --fail-on-warnings

      - name: Hook smoke
        run: |
          tmpdir="$(mktemp -d)"
          statedir="$(mktemp -d)"
          git init -q "$tmpdir"
          printf '{"cwd":"%s","hook_event_name":"SessionStart","session_id":"ci-session"}' "$tmpdir" \
            | node dist/index.js hook --repo "$tmpdir" --state-dir "$statedir" --harness codex --event SessionStart \
            | grep -q "agent-crystallize bootstrap"
          printf '{"cwd":"%s","hook_event_name":"PreCompact","trigger":"manual","session_id":"ci-session"}' "$tmpdir" \
            | node dist/index.js hook --repo "$tmpdir" --state-dir "$statedir" --harness codex --event PreCompact --strict-precompact
          before_count="$(find "$tmpdir/.agent-crystals/checkpoints" -type f | wc -l)"
          printf '{"cwd":"%s","hook_event_name":"PostCompact","trigger":"manual","compact_summary":"CI compact summary"}' "$tmpdir" \
            | node dist/index.js hook --repo "$tmpdir" --state-dir "$statedir" --harness codex --event PostCompact \
            | tee /tmp/agent-crystallize-postcompact.out
          after_count="$(find "$tmpdir/.agent-crystals/checkpoints" -type f | wc -l)"
          test "$before_count" = "$after_count"
          grep -q "agent-crystallize post-compact bootstrap" /tmp/agent-crystallize-postcompact.out
          printf '{"cwd":"%s","hook_event_name":"UserPromptSubmit","prompt":"continue after compact"}' "$tmpdir" \
            | node dist/index.js hook --repo "$tmpdir" --state-dir "$statedir" --harness codex --event UserPromptSubmit \
            | tee /tmp/agent-crystallize-prompt1.out
          grep -q "agent-crystallize post-compact bootstrap fallback" /tmp/agent-crystallize-prompt1.out
          printf '{"cwd":"%s","hook_event_name":"UserPromptSubmit","prompt":"continue again"}' "$tmpdir" \
            | node dist/index.js hook --repo "$tmpdir" --state-dir "$statedir" --harness codex --event UserPromptSubmit \
            > /tmp/agent-crystallize-prompt2.out
          test ! -s /tmp/agent-crystallize-prompt2.out
          node dist/index.js validate --repo "$tmpdir" --fail-on-warnings

      - name: Manifest smoke
        run: |
          tmpdir="$(mktemp -d)"
          git init -q "$tmpdir"
          first_path="$(node dist/index.js checkpoint --repo "$tmpdir" --project demo --body "Intermediate checkpoint." --decision "Temporary decision." --finding "Intermediate finding." --open-loop "Roll into session crystal." --test "Manifest smoke setup." --next-action "Create superseding crystal." | node -e 'let body = ""; process.stdin.on("data", c => body += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).relativePath));')"
          node dist/index.js now --repo "$tmpdir" --project demo --body "Session crystal supersedes the intermediate checkpoint." --relation "supersedes:$first_path" --decision "Session crystal is the resume source." --finding "Intermediate checkpoint remains trace only." --open-loop "None for smoke." --test "Manifest smoke setup." --next-action "Use active artifact from manifest."
          node dist/index.js manifest --repo "$tmpdir" --include-superseded --write \
            | node -e 'let body = ""; process.stdin.on("data", c => body += c); process.stdin.on("end", () => { const m = JSON.parse(body); if (m.activeCount !== 1 || m.supersededCount !== 1 || !m.supersededArtifacts?.length) process.exit(1); });'

      - name: Smoke
        run: |
          tmpdir="$(mktemp -d)"
          git init -q "$tmpdir"
          crystal_path="$(node dist/index.js checkpoint \
            --repo "$tmpdir" \
            --project demo \
            --surface cli \
            --body "Runtime smoke for structured crystal fields." \
            --agent-body ci-agent \
            --harness github-actions \
            --run-id "$GITHUB_RUN_ID" \
            --source-ref "workflow:.github/workflows/check.yml" \
            --topic "smoke" \
            --relation "relates_to:ci" \
            --decision "Keep CLI smoke coverage in CI." \
            --finding "Structured fields render into the generated crystal." \
            --open-loop "Replace this shell smoke with tests when the package grows." \
            --test "npm run check passed before smoke." \
            --next-action "Inspect CI result." \
            --evidence "GitHub Actions" \
            --memory-candidate "Runtime smoke should cover the CLI entrypoint." \
            | node -e 'let body = ""; process.stdin.on("data", c => body += c); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).relativePath));')"
          node dist/index.js validate --repo "$tmpdir" --fail-on-warnings
          node dist/index.js validate --repo "$tmpdir" --files "$crystal_path" --fail-on-warnings
