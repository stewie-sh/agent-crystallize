name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Smoke
        run: |
          tmpdir="$(mktemp -d)"
          git init -q "$tmpdir"
          node dist/index.js checkpoint \
            --repo "$tmpdir" \
            --project demo \
            --surface cli \
            --body "Runtime smoke for structured crystal fields." \
            --topic "smoke" \
            --relation "relates_to:ci" \
            --decision "Keep CLI smoke coverage in CI." \
            --finding "Structured fields render into the generated crystal." \
            --open-loop "Replace this shell smoke with tests when the package grows." \
            --test "npm run check passed before smoke." \
            --next-action "Inspect CI result." \
            --evidence "GitHub Actions" \
            --memory-candidate "Runtime smoke should cover the CLI entrypoint."
          node dist/index.js validate --repo "$tmpdir" --fail-on-warnings
