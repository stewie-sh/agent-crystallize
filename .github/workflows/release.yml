name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Verify tag matches package version
        run: |
          package_version="v$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi

      - name: Pack dry-run
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const sections = readFileSync('CHANGELOG.md', 'utf8').split(/^## /m);
          const section = sections.find(value => value.startsWith(`${version} - `));
          if (!section) throw new Error(`Missing changelog for ${version}`);
          writeFileSync('release-notes.md', `## ${section.trim()}\n`);
          NODE
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "agent-crystallize $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            || gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "agent-crystallize $GITHUB_REF_NAME" \
              --notes-file release-notes.md
